<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stop Digging Through Dashboards</title>
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="description" content="Vantage brings your metrics into one clear signal.">
<style>
/* ============ reset / base ============ */
*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0}
:root{
  font-family:"Reference Sans", Arial, sans-serif;
  color-scheme:dark;
  -webkit-text-size-adjust:100%;
}
html,body{overflow:hidden;background:#000}
html,body{height:100%;width:100%}
body{
  background:#000;
  color:#fff;
  font-family:"Reference Sans", Arial, sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow:hidden;
}
/* Reference font faces – variable, fractional weights */
@font-face{
  font-family:"Reference Sans";
  font-style:normal;
  font-weight:100 900;
  font-display:swap;
  src:local("Arial");
}
@font-face{
  font-family:"Reference Display";
  font-style:normal;
  font-weight:400 900;
  font-display:swap;
  src:local("Arial");
}
button,a{font-family:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:no-preference){
  button,a{transition:filter 140ms ease, opacity 140ms ease, transform 140ms ease}
  button:hover,a:hover{filter:brightness(1.08)}
}

/* ============ viewport / screen ============ */
.viewport{position:fixed;inset:0;isolation:isolate;background:#000;overflow:hidden}
.screen{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:100%;height:100%;background:#000;overflow:hidden;
  --gutter-start:clamp(36px,4.177vw,96px);
  --gutter-end:clamp(36px,4.04vw,96px);
  --header-top:clamp(20px,2.264vh,30px);
  --hero-bottom:clamp(34px,5.19vh,64px);
  --display-size:clamp(58px,7.64vh,88px);
  --display-leading:clamp(72px,9.34vh,106px);
  --copy-size:clamp(14px,1.70vh,19px);
  --copy-leading:clamp(19px,2.17vh,24px);
  --title-copy-gap:clamp(15px,2.08vh,24px);
  --copy-cta-gap:clamp(24px,3.11vh,36px);
  --cta-width:clamp(142px,15.09vh,168px);
  --cta-height:clamp(38px,3.96vh,44px);
  --compact-control-font-size:clamp(17px,1.75vh,19px);
  --action-control-font-size:clamp(17px,1.78vh,19.5px);
  --primary-control-font-size:clamp(17px,1.77vh,19.25px);
  --control-inline-nudge:-1px;
  --control-baseline-shift:clamp(1px,.19vh,2px);
  --copy-optical-shift:clamp(0px,.1vh,1px);
  --watch-baseline-shift:clamp(2px,.38vh,4px);
  --card-width:clamp(150px,18.96vh,215px);
}
.background{
  position:absolute;inset:0;z-index:-3;
  width:100%;height:100%;object-fit:cover;object-position:center;
  pointer-events:none;user-select:none;
  background:#000;
}
.screen::before{
  content:"";position:absolute;inset:0;z-index:-2;pointer-events:none;
  background:
    linear-gradient(180deg, rgba(0,0,0,.03), transparent 24%, transparent 82%, rgba(0,0,0,.05)),
    radial-gradient(ellipse at 44% 54%, transparent 30%, rgba(0,0,0,.055) 100%);
}
.screen::after{
  content:"";position:absolute;inset:0;z-index:5;pointer-events:none;
  background:linear-gradient(180deg, rgba(0,0,0,.12), transparent 18%, transparent 70%, rgba(0,0,0,.22));
  opacity:.5;
}

/* ============ header ============ */
.header{
  position:absolute;
  inset:var(--header-top) var(--gutter-end) auto var(--gutter-start);
  height:48px;display:flex;align-items:flex-start;white-space:nowrap;
  z-index:20;
}
.brand{
  position:relative;top:10px;
  width:25px;height:25px;display:inline-flex;flex:0 0 25px;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));
  border-radius:50%;
}
.brand svg{display:block;width:25px;height:25px;border-radius:50%}
.header-actions{
  display:flex;align-items:flex-start;flex:1 1 auto;min-width:0;
}
.nav{
  display:flex;align-items:flex-start;
  margin-left:clamp(36px,3.03vw,48px);
  gap:clamp(32px,2.9vw,43px);
  position:relative;top:9px;
}
.nav a{
  font-size:16px;font-weight:430;letter-spacing:-.36px;
  color:rgba(229,229,230,.77);
  text-shadow:0 1px 3px rgba(0,0,0,.55);
  text-decoration:none;position:relative;
  padding-bottom:8px;line-height:1;
}
.nav a:nth-child(1){position:relative;top:-3px}
.nav a:nth-child(4){margin-left:1px}
.nav a.active{color:#fff}
.nav a.active::after{
  content:"";position:absolute;left:0;bottom:0;
  width:44px;height:2px;background:rgba(255,255,255,.82);border-radius:2px;
}
.time-panel{
  margin-left:auto;
  width:211px;height:48px;
  padding-left:8px;
  border-left:2px solid rgba(230,230,230,.52);
  display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;
  gap:3px;
  position:relative;top:1px;
}
.time-label{
  font-size:15px;font-weight:420;letter-spacing:-.18px;
  color:rgba(240,240,240,.77);
  text-shadow:0 1px 3px rgba(0,0,0,.55);
  line-height:1.1;
}
.time-value{
  font-size:15px;font-weight:440;letter-spacing:-.18px;
  color:rgba(255,255,255,.93);
  text-shadow:0 1px 3px rgba(0,0,0,.6);
  line-height:1.1;white-space:nowrap;
}
.sign-up{
  width:109px;height:42px;flex:0 0 109px;
  border:0;border-radius:7px;
  background:#fff;color:#101010;
  font-size:var(--compact-control-font-size);
  font-weight:460;letter-spacing:-.34px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.72), 0 1px 5px rgba(0,0,0,.34);
  margin-left:clamp(20px,1.95vw,29px);
  display:inline-flex;align-items:center;justify-content:center;
  line-height:1;padding-bottom:1px;
}
.menu-toggle{display:none}

/* ============ hero ============ */
.hero{position:absolute;inset:0;z-index:10}
.hero-content{
  position:absolute;left:var(--gutter-start);bottom:var(--hero-bottom);
  display:flex;flex-direction:column;align-items:flex-start;
  max-width:calc(100vw - var(--gutter-start) - var(--gutter-end));
}
.hero-title{
  margin:0;
  font-family:"Reference Display","Reference Sans",Arial,sans-serif;
  font-weight:500;
  font-optical-sizing:auto;
  letter-spacing:-2.1px;
  white-space:nowrap;
  font-size:var(--display-size);
  line-height:var(--display-leading);
  text-shadow:0 2px 2px rgba(0,0,0,.44);
  -webkit-text-stroke:.12px currentColor;
}
.line{display:block;overflow:hidden;transform-origin:left center;line-height:inherit}
.line-reveal{display:inline-block;will-change:transform;line-height:inherit}
.line-one{color:#fff;transform:scaleX(.775)}
.line-two{color:rgba(211,207,207,.78);transform:scaleX(.793)}
.hero-copy{
  width:clamp(390px,31.67vw,500px);
  position:relative;left:1px;top:var(--copy-optical-shift);
  color:rgba(226,229,228,.84);
  font-weight:350;letter-spacing:.13px;
  font-size:var(--copy-size);line-height:var(--copy-leading);
  text-shadow:0 1px 3px rgba(0,0,0,.7);
  margin:var(--title-copy-gap) 0 0 0;
}
.primary-cta{
  position:relative;
  width:var(--cta-width);height:var(--cta-height);
  border:0;border-radius:7px;background:#fff;color:#111;
  box-shadow:0 1px 5px rgba(0,0,0,.38);
  margin-top:var(--copy-cta-gap);
  display:block;text-align:left;
}
.primary-cta .label{
  position:absolute;left:8.125%;top:50%;
  transform:translateY(-50%) translateY(calc(var(--control-baseline-shift) * .35));
  margin-left:var(--control-inline-nudge);
  font-weight:450;letter-spacing:-.3px;
  font-size:var(--primary-control-font-size);
  line-height:1;white-space:nowrap;color:#111;
}
.arrow-box{
  position:absolute;right:3.125%;top:14.286%;
  width:20.625%;height:71.429%;
  border-radius:7px;background:#070909;
  display:flex;align-items:center;justify-content:center;
}
.arrow-box svg{display:block}

/* ============ demo card ============ */
.demo-card{
  position:absolute;right:var(--gutter-end);bottom:var(--hero-bottom);
  width:var(--card-width);aspect-ratio:201/265;
  container-type:inline-size;
  border:1px solid rgba(255,255,255,.13);
  border-radius:clamp(12px,1.52vh,18px);
  background:linear-gradient(145deg, rgba(24,22,20,.80), rgba(5,12,14,.86));
  box-shadow:
    0 2px 10px rgba(0,0,0,.44),
    0 0 0 3px rgba(255,255,255,.035) inset,
    0 0 0 1px rgba(0,0,0,.9);
  backdrop-filter:blur(14px) saturate(108%);
  -webkit-backdrop-filter:blur(14px) saturate(108%);
  overflow:hidden;
  transform-origin:82% 50%;
}
.demo-visual{
  position:absolute;left:3.5cqw;top:4cqw;
  width:92.5cqw;height:92cqw;
  border-radius:4cqw;background:#101a1e;overflow:hidden;
  border:1px solid rgba(255,255,255,.08);
}
.demo-visual img{
  width:100%;height:100%;object-fit:cover;display:block;
  filter:brightness(.89) saturate(.93) contrast(1.03);
}
.play{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:29cqw;height:29cqw;border-radius:50%;
  border:1px solid rgba(255,255,255,.34);
  background:rgba(3,5,7,.47);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  padding:0;
}
.play svg{display:block;margin-left:8%}
.watch-button{
  position:absolute;left:3.5cqw;right:3.5cqw;bottom:4cqw;height:27.5cqw;
  border:1px solid rgba(255,255,255,.21);
  border-radius:3.2cqw;
  background:linear-gradient(145deg, rgba(26,34,36,.86), rgba(16,29,33,.9));
  backdrop-filter:blur(14px) saturate(108%);
  -webkit-backdrop-filter:blur(14px) saturate(108%);
  box-shadow:0 1px 6px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12);
  color:rgba(244,245,245,.94);
  font-weight:430;letter-spacing:-.22px;
  font-size:5.1cqw;
  display:flex;align-items:center;justify-content:center;
}
.watch-button span{transform:translateY(calc(var(--watch-baseline-shift) * .3));line-height:1}

/* ============ entrance motion ============ */
@keyframes entrance-brand{from{opacity:0;transform:translateY(7px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes entrance-nav{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes entrance-action{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes entrance-line{from{transform:translate3d(0,110%,0) skewY(2deg)}to{transform:translate3d(0,0,0) skewY(0deg)}}
@keyframes entrance-copy{from{opacity:0;transform:translateY(10px) scale(.992)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes entrance-card{from{opacity:0;transform:translateY(12px) scale(.968)}to{opacity:1;transform:translateY(0) scale(1)}}

@media (prefers-reduced-motion:no-preference){
  html.motion-pending .brand,
  html.motion-pending .nav a,
  html.motion-pending .time-panel,
  html.motion-pending .sign-up,
  html.motion-pending .menu-toggle,
  html.motion-pending .hero-copy,
  html.motion-pending .primary-cta,
  html.motion-pending .demo-card{opacity:0}
  html.motion-pending .line{overflow:hidden}
  html.motion-pending .line-reveal{transform:translate3d(0,110%,0) skewY(2deg)}
  html.motion-pending .hero-copy{transform:translateY(10px) scale(.992)}
  html.motion-pending .primary-cta{transform:translateY(8px) scale(.985)}
  html.motion-pending .demo-card{transform:translateY(12px) scale(.968)}

  html.motion-pending .brand{animation:entrance-brand 580ms cubic-bezier(.16,1,.3,1) 60ms forwards}
  html.motion-pending .nav a:nth-child(1){animation:entrance-nav 480ms cubic-bezier(.16,1,.3,1) 130ms forwards}
  html.motion-pending .nav a:nth-child(2){animation:entrance-nav 480ms cubic-bezier(.16,1,.3,1) 175ms forwards}
  html.motion-pending .nav a:nth-child(3){animation:entrance-nav 480ms cubic-bezier(.16,1,.3,1) 220ms forwards}
  html.motion-pending .nav a:nth-child(4){animation:entrance-nav 480ms cubic-bezier(.16,1,.3,1) 265ms forwards}
  html.motion-pending .time-panel{animation:entrance-nav 520ms cubic-bezier(.16,1,.3,1) 180ms forwards}
  html.motion-pending .sign-up{animation:entrance-action 520ms cubic-bezier(.16,1,.3,1) 220ms forwards}
  html.motion-pending .menu-toggle{animation:entrance-action 520ms cubic-bezier(.16,1,.3,1) 140ms forwards}
  html.motion-pending .line-one .line-reveal{animation:entrance-line 800ms cubic-bezier(.22,1,.36,1) 300ms forwards}
  html.motion-pending .line-two .line-reveal{animation:entrance-line 850ms cubic-bezier(.22,1,.36,1) 440ms forwards}
  html.motion-pending .hero-copy{animation:entrance-copy 620ms cubic-bezier(.16,1,.3,1) 740ms forwards}
  html.motion-pending .primary-cta{animation:entrance-action 560ms cubic-bezier(.16,1,.3,1) 960ms forwards}
  html.motion-pending .demo-card{animation:entrance-card 920ms cubic-bezier(.22,1,.36,1) 1040ms forwards}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html.motion-pending .brand,
  html.motion-pending .nav a,
  html.motion-pending .time-panel,
  html.motion-pending .sign-up,
  html.motion-pending .hero-copy,
  html.motion-pending .primary-cta,
  html.motion-pending .demo-card{opacity:1!important;transform:none!important}
  html.motion-pending .line-reveal{transform:none!important}
}

/* ============ tablet ============ */
@media (min-width:620px) and (max-width:790px), (min-width:620px) and (max-width:1100px) and (orientation:portrait){
  .header{align-items:flex-start}
  .menu-toggle{
    display:inline-flex;align-items:center;justify-content:center;
    margin-left:auto;
    width:46px;height:46px;flex:0 0 46px;
    border-radius:11px;
    border:1px solid rgba(255,255,255,.18);
    background:linear-gradient(145deg, rgba(26,34,36,.72), rgba(10,18,20,.78));
    backdrop-filter:blur(14px) saturate(108%);
    -webkit-backdrop-filter:blur(14px) saturate(108%);
    box-shadow:0 2px 10px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.14);
    position:relative;top:0;
  }
  .menu-toggle svg{width:20px;height:20px;display:block}
  .menu-toggle .l{transition:transform 220ms cubic-bezier(.16,1,.3,1), opacity 160ms}
  .header.menu-open .menu-toggle .l-top{transform:translateY(4px) rotate(45deg)}
  .header.menu-open .menu-toggle .l-bot{transform:translateY(-4px) rotate(-45deg)}
  .header-actions{
    position:absolute;top:56px;right:0;
    flex-direction:column;align-items:stretch;gap:14px;
    width:min(324px, calc(100vw - var(--gutter-start) - var(--gutter-end)));
    padding:18px;
    border:1px solid rgba(255,255,255,.14);
    border-radius:16px;
    background:linear-gradient(145deg, rgba(22,26,28,.88), rgba(6,12,14,.92));
    backdrop-filter:blur(18px) saturate(110%);
    -webkit-backdrop-filter:blur(18px) saturate(110%);
    box-shadow:0 12px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12);
    opacity:0;visibility:hidden;transform:translateY(-8px) scale(.985);
    transform-origin:top right;
    transition:opacity 200ms ease, transform 220ms cubic-bezier(.16,1,.3,1), visibility 200ms;
  }
  .header.menu-open .header-actions{opacity:1;visibility:visible;transform:translateY(0) scale(1)}
  .nav{flex-direction:column;gap:12px;margin:0;top:0}
  .nav a{font-size:17px;padding:6px 2px}
  .nav a:nth-child(1){top:0}
  .nav a.active::after{width:28px}
  .time-panel{margin:0;width:auto;height:auto;border-left:0;padding:10px 2px 0;border-top:1px solid rgba(255,255,255,.12)}
  .sign-up{margin:4px 0 0;width:100%;flex-basis:auto;height:44px}
}

/* ============ mobile ============ */
@media (max-width:619px){
  .screen{
    --mobile-gutter:clamp(18px,5.2vw,26px);
  }
  .header{
    inset:calc(var(--header-top) + env(safe-area-inset-top,0px)) var(--mobile-gutter) auto var(--mobile-gutter);
  }
  .menu-toggle{
    display:inline-flex;align-items:center;justify-content:center;
    margin-left:auto;
    width:46px;height:46px;flex:0 0 46px;
    border-radius:11px;
    border:1px solid rgba(255,255,255,.18);
    background:linear-gradient(145deg, rgba(26,34,36,.72), rgba(10,18,20,.78));
    backdrop-filter:blur(14px) saturate(108%);
    -webkit-backdrop-filter:blur(14px) saturate(108%);
    box-shadow:0 2px 10px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.14);
  }
  .menu-toggle svg{width:20px;height:20px}
  .menu-toggle .l{transition:transform 220ms cubic-bezier(.16,1,.3,1)}
  .header.menu-open .menu-toggle .l-top{transform:translateY(4px) rotate(45deg)}
  .header.menu-open .menu-toggle .l-bot{transform:translateY(-4px) rotate(-45deg)}
  .header-actions{
    position:absolute;top:56px;right:0;left:auto;
    flex-direction:column;align-items:stretch;gap:14px;
    width:min(340px, calc(100vw - 2 * var(--mobile-gutter)));
    padding:18px;
    border:1px solid rgba(255,255,255,.14);
    border-radius:16px;
    background:linear-gradient(145deg, rgba(22,26,28,.88), rgba(6,12,14,.92));
    backdrop-filter:blur(18px) saturate(110%);
    -webkit-backdrop-filter:blur(18px) saturate(110%);
    box-shadow:0 12px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12);
    opacity:0;visibility:hidden;transform:translateY(-8px) scale(.985);
    transform-origin:top right;
    transition:opacity 200ms ease, transform 220ms cubic-bezier(.16,1,.3,1), visibility 200ms;
  }
  .header.menu-open .header-actions{opacity:1;visibility:visible;transform:translateY(0) scale(1)}
  .nav{flex-direction:column;gap:12px;margin:0;top:0}
  .nav a{font-size:17px}
  .nav a:nth-child(1){top:0}
  .time-panel{margin:0;width:auto;height:auto;border-left:0;padding:10px 0 0;border-top:1px solid rgba(255,255,255,.12)}
  .sign-up{margin:4px 0 0;width:100%;flex-basis:auto}

  .hero-content{
    left:var(--mobile-gutter);right:var(--mobile-gutter);
    bottom:calc(var(--hero-bottom) + env(safe-area-inset-bottom,0px));
    max-width:none;
  }
  .hero-title{font-size:clamp(44px,13.2vw,68px);line-height:1.08;letter-spacing:-1.4px}
  .line-one{transform:scaleX(.78)}
  .line-two{transform:scaleX(.55)}
  .hero-copy{width:auto;max-width:34ch;font-size:15px;line-height:22px}
  .hero-copy br{display:none}
  .primary-cta{width:164px;height:44px}
  .demo-card{
    left:auto;right:var(--mobile-gutter);
    top:clamp(176px,32svh,300px);bottom:auto;
    width:clamp(132px,36vw,168px);
  }
}
@media (max-width:619px) and (max-height:620px){
  .demo-card{top:clamp(140px,26svh,200px);width:clamp(120px,32vw,150px)}
  .hero-title{font-size:clamp(38px,11vw,54px)}
}
@media (max-width:619px) and (orientation:landscape){
  .hero-content{bottom:18px}
  .demo-card{top:84px;width:132px}
  .hero-title{font-size:42px;line-height:1.05}
  .hero-copy{font-size:13.5px;line-height:19px;max-width:52ch}
  .hero-copy br{display:none}
}
@media (min-width:620px) and (max-height:520px){
  .screen{--hero-bottom:20px;--display-size:52px;--display-leading:62px}
  .demo-card{width:150px}
}
</style>
<script>
(function(){
  try{
    document.documentElement.classList.add('motion-pending');
    window.__vantageMotionFallback = setTimeout(function(){
      document.documentElement.classList.remove('motion-pending');
    }, 3500);
  }catch(e){}
})();
</script>

<script>
(function(){
  var root = document.documentElement;
  function clearMotion(){
    if(root.classList.contains('motion-pending')){
      root.classList.remove('motion-pending');
    }
    if(window.__vantageMotionFallback){
      clearTimeout(window.__vantageMotionFallback);
      window.__vantageMotionFallback = null;
    }
  }
  // reduced-motion: clear immediately
  try{
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      clearMotion();
    }
  }catch(e){}

  document.addEventListener('DOMContentLoaded', function(){
    var card = document.querySelector('.demo-card');
    if(card){
      card.addEventListener('animationend', function handler(ev){
        // only respond to the card's own entrance-card animation
        if(ev.target === card){
          clearMotion();
          card.removeEventListener('animationend', handler);
        }
      });
    }
    // safety: if animations never start (e.g. cached / hidden), fallback timeout from head clears

    // ---- menu toggle ----
    var header = document.getElementById('site-header');
    var toggle = header ? header.querySelector('.menu-toggle') : null;
    var panel = document.getElementById('tablet-navigation');
    function isToggleVisible(){
      return toggle && window.getComputedStyle(toggle).display !== 'none';
    }
    function syncInert(){
      if(!panel) return;
      try{
        if(isToggleVisible()){
          var open = header.classList.contains('menu-open');
          if(open){ panel.removeAttribute('inert'); }
          else{ panel.setAttribute('inert',''); }
        }else{
          panel.removeAttribute('inert');
        }
      }catch(e){}
    }
    function setOpen(open, focusFirst){
      if(!header || !toggle) return;
      header.classList.toggle('menu-open', open);
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      toggle.setAttribute('aria-label', open ? 'Close menu' : 'Menu');
      syncInert();
      if(open && focusFirst){
        var first = panel ? panel.querySelector('.nav a') : null;
        if(first){ try{ first.focus({preventScroll:true}); }catch(e){ try{first.focus();}catch(_){}} }
      }
    }
    if(toggle && header && panel){
      syncInert();
      toggle.addEventListener('click', function(ev){
        ev.stopPropagation();
        var open = !header.classList.contains('menu-open');
        setOpen(open, open);
      });
      panel.addEventListener('click', function(ev){
        var link = ev.target.closest ? ev.target.closest('a') : null;
        if(link && header.classList.contains('menu-open')) setOpen(false, false);
      });
      document.addEventListener('pointerdown', function(ev){
        if(!header.classList.contains('menu-open')) return;
        if(header.contains(ev.target)) return;
        setOpen(false, false);
      });
      document.addEventListener('keydown', function(ev){
        if(ev.key === 'Escape' && header.classList.contains('menu-open')){
          setOpen(false, false);
          try{ toggle.focus({preventScroll:true}); }catch(e){ try{toggle.focus();}catch(_){} }
        }
      });
      window.addEventListener('resize', syncInert);
    }
  });
})();
</script>
